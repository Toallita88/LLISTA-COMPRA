<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenúFácil Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="app" class="max-w-6xl mx-auto p-4 sm:p-6">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-700 flex items-center gap-2">
                    <i class="fa-solid fa-utensils"></i> MenúFácil Pro
                </h1>
                <p class="text-slate-500 text-sm">Tu planificador inteligente de menús y compras con aislamiento por dispositivo.</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Sincronizado
                </span>
            </div>
        </header>

        <main class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-semibold mb-4 text-slate-700">Planificador del Menú Diario</h2>
                <div id="menu-days-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Las tarjetas del menú se renderizan dinámicamente aquí -->
                    <div class="p-6 border border-slate-200 rounded-xl bg-slate-50 text-center">
                        <i class="fa-solid fa-spinner animate-spin text-emerald-600 text-2xl mb-2"></i>
                        <p class="text-sm text-slate-600">Cargando menús optimizados...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const RECIPES_DB = {
            lunch: [
                {
                    name: "Tortilla de patatas y cebolla tradicional",
                    description: "La reina de la cocina casera española.",
                    time: 25,
                    ingredients: [
                        { name: "Patatas", baseQty: 639, unit: "g", pricePerKg: 2.10 },
                        { name: "Huevos", baseQty: 6, unit: "unidades", pricePerKg: 3.50 }
                    ]
                },
                {
                    name: "Espirales de pasta con verduras y dados de pavo",
                    description: "Pasta rápida salteada con verduras de temporada y pavo.",
                    time: 15,
                    ingredients: [
                        { name: "Espirales de pasta", baseQty: 227, unit: "g", pricePerKg: 1.80 },
                        { name: "Jamón cocido / pavo", baseQty: 170, unit: "g", pricePerKg: 7.00 }
                    ]
                }
            ],
            dinner: [
                {
                    name: "Pechuga de pollo a la plancha con puré de patata casero",
                    description: "Una receta clásica, ligera y rica en proteínas.",
                    time: 20,
                    ingredients: [
                        { name: "Pechuga de pollo", baseQty: 312, unit: "g", pricePerKg: 6.50 },
                        { name: "Patatas", baseQty: 497, unit: "g", pricePerKg: 2.10 }
                    ]
                }
            ]
        };

        let appState = {
            activeTab: 'menu',
            people: 2,
            budgetFactor: 1.0,
            selectedDays: ['lunes', 'martes', 'miercoles'],
            selectedMeals: ['lunch', 'dinner'],
            currentPlan: {}
        };

        function renderMenuUI() {
            const grid = document.getElementById('menu-days-grid');
            if (!grid) return;
            grid.innerHTML = "";
            
            const daysList = [
                { id: 'lunes', name: 'Lunes' },
                { id: 'martes', name: 'Martes' },
                { id: 'miercoles', name: 'Miércoles' }
            ];

            daysList.forEach(dayObj => {
                let dayHtml = `
                    <div class="border border-slate-200 rounded-2xl p-5 bg-white shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="font-bold text-lg text-slate-800 flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> ${dayObj.name}
                                </span>
                                <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-medium rounded-full">Variado</span>
                            </div>
                            <div class="space-y-4">
                `;

                appState.selectedMeals.forEach(mealType => {
                    const mealList = RECIPES_DB[mealType] || RECIPES_DB.lunch;
                    const recipe = mealList[0];
                    const mealName = mealType === 'lunch' ? 'Comida (Mediodía)' : 'Cena';

                    dayHtml += `
                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                            <div class="flex justify-between items-center text-xs text-slate-500 mb-1">
                                <span class="font-semibold text-amber-600"><i class="fa-solid fa-sun"></i> ${mealName}</span>
                                <span><i class="fa-regular fa-clock"></i> ${recipe.time} min</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm mb-1">${recipe.name}</h3>
                            <p class="text-xs text-slate-500 mb-3">${recipe.description}</p>
                            <div class="border-t border-slate-200 pt-2 mt-2">
                                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Ingredientes principales:</p>
                                <ul class="text-xs space-y-1 text-slate-600">
                    `;

                    recipe.ingredients.forEach(ing => {
                        dayHtml += `<li class="flex justify-between"><span>• ${ing.name}</span><span class="font-medium text-slate-700">${ing.baseQty} ${ing.unit}</span></li>`;
                    });

                    dayHtml += `
                                </ul>
                            </div>
                        </div>
                    `;
                });

                dayHtml += `
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += dayHtml;
            });
        }

        document.addEventListener("DOMContentLoaded", renderMenuUI);
    </script>
</body>
</html>
